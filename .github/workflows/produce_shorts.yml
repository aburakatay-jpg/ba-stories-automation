```yaml
name: BA Stories - Shorts Üretim

on:
  schedule:
    # Pazartesi, Çarşamba, Perşembe, Cumartesi, Pazar - 09:00 TR
    - cron: '0 6 * * 1,3,4,6,0'

  workflow_dispatch:

jobs:

  generate:
    runs-on: ubuntu-latest

    steps:

      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg kurulumu
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Python bağımlılıklarını kur
        run: |
          python -m pip install --upgrade pip
          pip install pillow gTTS edge-tts google-api-python-client google-auth-oauthlib requests

      - name: Kısa senaryo yaz (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_script_shorts.py

      - name: Seslendirme üret (Edge TTS)
        run: |
          python scripts/generate_tts.py output/senaryo.txt output/ses.mp3

      - name: Thumbnail oluştur
        run: |
          python scripts/generate_thumbnail.py output/tema.json output/baslik.txt output/

      - name: Short'u kurgula
        run: |
          python scripts/assemble_short_scenes.py \
            output/ \
            output/ses.mp3 \
            output/video.mp4 \
            music \
            shorts_

      - name: Videoyu artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: video-cikti
          path: output/
          retention-days: 14

      - name: Tema geçmişini kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add scripts/tema_gecmisi_shorts.json

          git diff --staged --quiet || git commit -m "tema gecmisi guncellendi [skip ci]"

          git push


  onay_ve_yukleme:
    needs: generate
    runs-on: ubuntu-latest

    environment:
      name: youtube-upload

    steps:

      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Video artifact'ını indir
        uses: actions/download-artifact@v4
        with:
          name: video-cikti
          path: output/

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: YouTube bağımlılıklarını kur
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib

      - name: YouTube'a yükle
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python scripts/upload_youtube.py \
            output/video.mp4 \
            output/baslik.txt \
            output/aciklama.txt \
            output/playlist_id.txt


  bildirim:
    needs:
      - generate
      - onay_ve_yukleme

    runs-on: ubuntu-latest

    if: ${{ failure() }}

    steps:

      - name: Hata bildirimi gönder (Telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ BA Stories Shorts üretim hatası%0A%0AWorkflow: ${{ github.workflow }}%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0A%0AHatayı incelemek için linke tıkla."
```
