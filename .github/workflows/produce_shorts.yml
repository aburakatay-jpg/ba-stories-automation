name: BA Stories - Shorts Üretim

on:
  schedule:
    - cron: '0 15 * * 0,1,3,4,6'
  workflow_dispatch:

jobs:
  produce-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Videoların arka planda hatasız birleşebilmesi için Linux sunucusuna FFmpeg kuruyoruz
      - name: Sistem Gereksinimlerini Yükle (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests edge-tts urllib3
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Hata vermemesi için çıktı ve müzik klasörlerini baştan zorla oluşturuyoruz
      - name: Klasörleri Hazırla
        run: |
          mkdir -p output
          mkdir -p assets/music

      - name: Senaryo ve Başlık Üretimi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_script.py
          
      - name: Kapak Fotoğrafı (Thumbnail) Üretimi
        run: |
          python scripts/generate_thumbnail.py output/tema.json output/baslik.txt output/thumbnail.jpg

      - name: Ses Dosyası (TTS) Üretimi
        run: |
          python scripts/generate_tts.py output/senaryo.txt output/ses.mp3

      - name: Sahne Görsellerini Üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_scene_images.py output/tema.json output/baslik.txt output/senaryo.txt output

      # İstenen tüm parametreler eklendi: <gorsel_prefix> <ses> <cikti> <music_dir>
      - name: Videoyu Birleştir
        run: |
          python scripts/assemble_video_shorts.py output/scene output/ses.mp3 output/final_video.mp4 assets/music

      # Bir sonraki adımda hata vermemesi için YouTube yükleyiciye standart argümanlar eklendi
      - name: YouTube'a Yükle
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/upload_youtube.py output/final_video.mp4 output/baslik.txt output/aciklama.txt

      - name: Başarılı Üretim Telegram Bildirimi
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "output/baslik.txt" ]; then
            BASLIK=$(cat output/baslik.txt)
          else
            BASLIK="Yeni Shorts Videosu"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d text="✅ BA Hikayeleri: Yeni Shorts Videosu Başarıyla Üretildi ve Yüklendi! 🚀%0A%0ABaşlık: ${BASLIK}"
