name: BA Stories - Shorts Üretim

on:
  schedule:
    # TSİ 18:00 (UTC 15:00) - Pazar, Pazartesi, Çarşamba, Perşembe, Cumartesi
    - cron: '0 15 * * 0,1,3,4,6'
  workflow_dispatch: # Manuel "Run workflow" butonunu aktif eden komut

jobs:
  produce-shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests edge-tts urllib3
          # Varsa kendi gereksinim dosyanı (pip install -r requirements.txt) buraya ekleyebilirsin.

      - name: Senaryo ve Başlık Üretimi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_script.py
          
      - name: Kapak Fotoğrafı (Thumbnail) Üretimi
        run: |
          python scripts/generate_thumbnail.py output/tema.json output/baslik.txt output/thumbnail.jpg

      - name: Ses Dosyası (TTS) Üretimi
        run: |
          python scripts/generate_tts.py output/senaryo.txt output/ses.mp3


      # --- VİDEO BİRLEŞTİRME VE YÜKLEME ADIMLARI ---
      # (Mevcut sistemindeki video kurgu ve YouTube upload scriptlerini buraya ekle)
      # Örnek:
      # - name: Videoyu Birleştir
      #   run: python scripts/build_video.py
      # - name: YouTube'a Yükle
      #   run: python scripts/upload_youtube.py

      # --- BİLDİRİM ADIMI ---
      - name: Başarılı Üretim Telegram Bildirimi
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Başlık dosyasını güvenli bir şekilde oku
          if [ -f "output/baslik.txt" ]; then
            BASLIK=$(cat output/baslik.txt)
          else
            BASLIK="Yeni Shorts Videosu"
          fi
          
          # Telegram API'sine mesajı gönder
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d text="✅ BA Hikayeleri: Yeni Shorts Videosu Başarıyla Üretildi! 🚀%0A%0ABaşlık: ${BASLIK}"
