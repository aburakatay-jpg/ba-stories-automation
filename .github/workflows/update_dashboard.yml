name: Günlük Dashboard Güncellemesi
on:
  schedule:
    # Türkiye saatiyle her gece 23:00'te (UTC 20:00) tüm tabloyu günceller
    - cron: '0 20 * * *'
  workflow_dispatch: # İstediğin zaman manuel çalıştırman için buton ekler

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Run Update Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python scripts/update_stats.py
